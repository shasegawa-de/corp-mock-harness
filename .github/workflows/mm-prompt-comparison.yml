name: MM1/MM2 A-B-C prompt comparison

on:
  pull_request:
    paths:
      - 'prompts/experiments/**'
      - 'scripts/prompt-comparison*.mjs'
      - 'tests/prompt-comparison.test.mjs'
      - '.github/workflows/mm-prompt-comparison.yml'
  workflow_dispatch:
    inputs:
      arm:
        description: 'One fixed experiment arm'
        required: true
        type: choice
        options:
          - mm1-a
          - mm1-b
          - mm1-c
          - mm2-a
          - mm2-b
          - mm2-c
      trial:
        description: 'Independent replicate for this arm'
        required: true
        type: choice
        options:
          - '1'
          - '2'
      execute:
        description: 'Generate ONE paid image; false is free dry-run'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compare-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Run mock API and lexical tests
        run: node --test tests/prompt-comparison.test.mjs
      - name: Verify all six arms without image API
        run: |
          for arm in mm1-a mm1-b mm1-c mm2-a mm2-b mm2-c; do
            for trial in 1 2; do
              node scripts/prompt-comparison-cli.mjs --arm="$arm" --trial="$trial" --dry-run
            done
          done
      - name: Only allow paid execution from the reviewed main branch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute }}
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Generate exactly one paid unapproved image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute }}
        env:
          ARM: ${{ inputs.arm }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/prompt-comparison-cli.mjs --arm="$ARM" --trial="${{ inputs.trial }}" --execute --output="$RUNNER_TEMP/mm-comparison"
      - name: Keep result for human QA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute }}
        uses: actions/upload-artifact@v4
        with:
          name: mm-comparison-${{ inputs.arm }}-trial-${{ inputs.trial }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mm-comparison/
          if-no-files-found: error
          retention-days: 14
