name: Publish catalog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out canonical catalog
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload catalog
        uses: actions/upload-pages-artifact@v4
        with:
          path: catalog
      - name: Deploy catalog
        id: deployment
        uses: actions/deploy-pages@v4
