name: Publish catalog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'assets/**'
      - 'catalog-next/**'
      - 'configs/**'
      - 'AGENTS.md'
      - 'STYLE.md'
      - 'scripts/build-pages.mjs'
      - 'scripts/import-approved-assets.py'
      - 'scripts/render-next-catalog.mjs'
      - 'tests/prompt-builder.test.mjs'
      - 'tests/browser-smoke.mjs'
      - 'scripts/gpt-image-transport.mjs'
      - 'scripts/generate-gpt-image.mjs'
      - 'tests/gpt-image-transport.test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out canonical catalog
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Expand uploaded ZIP and verify four approved original PNGs
        run: python3 scripts/import-approved-assets.py
      - name: Register original PNG files on GitHub main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/architectural-surfaces/*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: register four verified user-approved PNG originals"
            git push origin HEAD:main
          fi
      - name: Check prompt combinations
        run: node --test tests/prompt-builder.test.mjs tests/gpt-image-transport.test.mjs tests/approved-assets.test.mjs
      - name: Dry-run all four locked GPT Image prompts without API calls
        run: |
          for SCENE in surface-microcement-wall-floor surface-fiber-cement-wall surface-carrara-marble surface-graphite-marble; do
            node scripts/generate-gpt-image.mjs --scene="$SCENE" --dry-run
          done
      - name: Prepare both catalog versions
        run: node scripts/build-pages.mjs
      - name: Install headless browser smoke dependency
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Smoke test filters and composer in Chrome
        run: node tests/browser-smoke.mjs
      - name: Upload catalog
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy catalog
        id: deployment
        uses: actions/deploy-pages@v4
