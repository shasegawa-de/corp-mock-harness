name: Publish catalog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'assets/**'
      - 'catalog-next/**'
      - 'configs/**'
      - 'AGENTS.md'
      - 'STYLE.md'
      - 'scripts/build-pages.mjs'
      - 'scripts/render-next-catalog.mjs'
      - 'tests/prompt-builder.test.mjs'
      - 'tests/browser-smoke.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out canonical catalog
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Check prompt combinations
        run: node --test tests/prompt-builder.test.mjs
      - name: Prepare both catalog versions
        run: node scripts/build-pages.mjs
      - name: Install headless browser smoke dependency
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Smoke test filters and composer in Chrome
        run: node tests/browser-smoke.mjs
      - name: Upload catalog
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy catalog
        id: deployment
        uses: actions/deploy-pages@v4
